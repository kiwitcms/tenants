services:
    db:
        container_name: postgresql_database
        image: postgres:latest
        restart: always
        ports:
            - 5432:5432
        volumes:
            - postgresql_database_data:/var/lib/postgresql
        environment:
            POSTGRES_DB: test_project
            POSTGRES_USER: kiwi
            POSTGRES_PASSWORD: kiwi

    pgadmin:
        container_name: pgadmin
        image: dpage/pgadmin4
        restart: always
        ports:
            - 8888:80
        environment:
            PGADMIN_DEFAULT_EMAIL: pgadmin@kiwitcms.org
            PGADMIN_DEFAULT_PASSWORD: kiwi

    rustfs:
        container_name: rustfs
        image: rustfs/rustfs:1.0.6
        restart: always
        ports:
            - 9000:9000
        volumes:
            - rustfs_data:/data
        environment:
            RUSTFS_ACCESS_KEY: rustfsadmin
            RUSTFS_SECRET_KEY: rustfsadmin

volumes:
    postgresql_database_data:
    rustfs_data:
